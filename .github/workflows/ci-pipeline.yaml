name: CI Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
  workflow_dispatch:

jobs:
  # DEPRECATED: PR Stack Check is currently deprecated. Disabled by commenting
  # out the job below and its downstream `needs`/`if` references in the
  # `lint` and `setup` jobs.
  # pr-stack:
  #   name: PR Stack Check
  #   runs-on: ubuntu-latest
  #   outputs:
  #     skip_ci: ${{ steps.check.outputs.skip_ci }}
  #   steps:
  #     - name: Check if CI should run
  #       id: check
  #       continue-on-error: true
  #       env:
  #         EVENT_JSON: ${{ toJson(github.event) }}
  #       run: |
  #         RESPONSE=$(curl -s -X POST https://pr-stack.fly.dev/ci-check \
  #           -H "Content-Type: application/json" \
  #           -d "$EVENT_JSON")
  #         echo "Response: $RESPONSE"
  #         SKIP_CI=$(echo "$RESPONSE" | jq -r '.skipCI' 2>/dev/null) || SKIP_CI="false"
  #         echo "skip_ci=${SKIP_CI:-false}" >> $GITHUB_OUTPUT

  lint:
    name: Linting
    runs-on: ubuntu-latest
    # DEPRECATED: PR Stack Check disabled, see pr-stack job above.
    # needs: [pr-stack]
    # if: needs.pr-stack.outputs.skip_ci != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci . --error-on-warnings

  setup:
    name: Setup
    # DEPRECATED: PR Stack Check disabled, see pr-stack job above.
    needs: [lint]
    # if: needs.pr-stack.outputs.skip_ci != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check if node_modules cache exists
        id: cache-check
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          lookup-only: true

      - name: Setup Node.js
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Save node_modules cache
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    needs: [lint, setup]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node_modules
      
      - name: Install dependencies if cache misses
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      
      - name: Run Type Check
        run: pnpm types:check

  build-app:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint, setup, type-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node_modules

      - name: Install dependencies if cache misses
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
        shell: bash

      - name: Restore build caches
        uses: actions/cache/restore@v5
        with:
          path: |
            .turbo
            apps/*/.next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-build-

      - name: Build Application
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          NEXT_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          GOOGLE_WALLET_ISSUER_ID: ${{ secrets.GOOGLE_WALLET_ISSUER_ID }}
          GOOGLE_WALLET_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_WALLET_SERVICE_ACCOUNT_KEY }}
          DISCORD_SERVER_ID: ${{ secrets.DISCORD_SERVER_ID }}
        run: pnpm build

      # Only main writes an entry. PR runs still read the cache, but don't each
      # add a copy that pushes the shared node_modules cache out under the 10GB
      # LRU limit.
      - name: Save build caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: |
            .turbo
            apps/*/.next/cache
          key: ${{ runner.os }}-build-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: [lint, setup, type-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node_modules

      - name: Install dependencies if cache misses
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Storybook
        shell: bash
        run: pnpm storybook:build