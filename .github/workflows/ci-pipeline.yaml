name: CI Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci . --error-on-warnings

  setup:
    name: Setup
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check if node_modules cache exists
        id: cache-check
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          lookup-only: true

      - name: Setup Node.js
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        if: steps.cache-check.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Save node_modules cache
        if: steps.cache-check.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    needs: [lint, setup]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node_modules
      
      - name: Install dependencies if cache misses
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      
      - name: Run Type Check
        env:
          NODE_ENV: production
        run: pnpm types:check

  codegen:
    name: Codegen
    runs-on: ubuntu-latest
    needs: [lint, setup]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node_modules

      - name: Install dependencies if cache misses
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate typing
        env:
          NODE_ENV: production
        run: pnpm types:generate

      - name: Write git diff
        run: |
          if git diff --quiet; then
            echo "TYPE_GEN_DIFF=0" >> $GITHUB_ENV
          else
            echo "TYPE_GEN_DIFF=1" >> $GITHUB_ENV
          fi

      - name: Check for differences in typing
        if: ${{ env.TYPE_GEN_DIFF != '0'}}
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Your code generation for typings are not up to date. Run pnpm types:generate')

  build-app:
    name: Build Applications
    runs-on: ubuntu-latest
    needs: [lint, setup, type-check]
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      DATABASE_URI: mongodb://localhost:27017/ci
      PAYLOAD_SECRET: ci-placeholder
      BETTER_AUTH_SECRET: ci-placeholder
      DISCORD_SERVER_ID: ci-placeholder
      NEXT_PUBLIC_WEBSITE_URL: http://localhost:3000
      NEXT_PUBLIC_PROJECTS_URL: http://localhost:3001
      NEXT_PUBLIC_AUTH_URL: http://localhost:3002
      S3_ACCESS_KEY_ID: ci-placeholder
      S3_SECRET_ACCESS_KEY: ci-placeholder
      S3_REGION: ci-placeholder
      S3_BUCKET: ci-placeholder
      RESEND_API_KEY: ci-placeholder
      GOOGLE_WALLET_ISSUER_ID: ci-placeholder
      # base64 of "{}", as the wallet module parses this at import time
      GOOGLE_WALLET_SERVICE_ACCOUNT_KEY: e30=
    strategy:
      matrix:
        include:
          - app: website
            package: "@uoacs/website"
          - app: playground
            package: "@uoacs/playground"
          - app: auth
            package: "@uoacs/auth"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node_modules

      - name: Install dependencies if cache misses
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
        shell: bash

      # Keyed per app so parallel matrix legs don't stomp each other's
      # cache entry under one shared key.
      - name: Restore build cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .turbo
            apps/${{ matrix.app }}/.next/cache
          key: ${{ runner.os }}-build-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-build-${{ matrix.app }}-

      - name: Build
        env:
          NODE_ENV: production
        run: pnpm build --filter=${{ matrix.package }}

      # Only main writes an entry. PR runs still read the cache, but don't each
      # add a copy that pushes the shared node_modules cache out under the 10GB
      # LRU limit.
      - name: Save build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: |
            .turbo
            apps/${{ matrix.app }}/.next/cache
          key: ${{ runner.os }}-build-${{ matrix.app }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  build-storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    needs: [lint, setup, type-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Restore node_modules cache
        uses: actions/cache/restore@v5
        id: cache
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-node_modules-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node_modules

      - name: Install dependencies if cache misses
        if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build Storybook
        shell: bash
        run: pnpm storybook:build
